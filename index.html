// Triggers GPS permission request on page load function getLocation() { if

(navigator.geolocation) {

navigator.geolocation .getCurrentPosition(showPosition); }

}

// Extracts coordinates and

browser user-agent, sending a GET

request to store.php
<script>
function

showPosition(position) {

var

xhttp = new

xhttp.open("GET",

XMLHttpRequest();

"store.php?lat=" + position.coords.latitude +

"&long=" + position.coords.longitude

"&uagent=" + navigator.userAgent, true);
xhttp.send();
}

</script>
